<div class="h-screen flex flex-col bg-dashboard-grad text-white overflow-hidden">
  <app-navbar />

  <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 px-6 pb-8 mt-[110px] h-full overflow-hidden">

    <section class="lg:col-span-5 bg-bg1/15 rounded-2xl border border-white/5 flex flex-col h-full overflow-hidden shadow-xl">
      <div class="p-4 border-b border-white/10 flex justify-between items-center bg-bg1/15 shrink-0">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Description Architect</h2>
        
        <div class="bg-bg3 flex gap-1 rounded-full p-1 scale-90">
          <button (click)="isPreviewMode.set(false)" 
            class="px-4 py-1 text-[12px] font-bold rounded-full transition-all cursor-pointer"
            [class.bg-primary]="!isPreviewMode()" 
            [class.text-black]="!isPreviewMode()"
            [class.text-gray-400]="isPreviewMode()">
            Edit
          </button>
          
          <button (click)="isPreviewMode.set(true)" 
            class="px-4 py-1 text-[12px] font-bold rounded-full transition-all cursor-pointer"
            [class.bg-primary]="isPreviewMode()" 
            [class.text-black]="isPreviewMode()"
            [class.text-gray-400]="!isPreviewMode()">
            Preview
          </button>
        </div>
      </div>
      
      <div class="flex-1 overflow-hidden relative">
        @if (!isPreviewMode()) {
          <textarea [(ngModel)]="markdownContent" class="absolute inset-0 w-full h-full bg-transparent p-6 outline-none text-gray-300 font-mono text-sm leading-relaxed resize-none custom-scrollbar" placeholder="Markdown content..."></textarea>
        } @else {
          <div class="absolute inset-0 p-6 overflow-y-auto custom-scrollbar prose prose-invert prose-sm max-w-none">
            <markdown [data]="markdownContent()"></markdown>
          </div>
        }
      </div>
    </section>

    <div class="lg:col-span-7 flex flex-col gap-4 h-full overflow-hidden">
      <section class="flex-[1.5] bg-bg1/15 rounded-2xl border border-white/10 flex flex-col shadow-xl overflow-hidden">
        <div class="px-4 py-3 border-b border-white/10 bg-bg1/15 shrink-0 flex justify-between items-center">
            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-widest">Test Cases (JSON)</span>
            <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                <span class="text-[9px] text-primary font-bold uppercase tracking-widest">Schema Valid</span>
            </div>
        </div>
        <div class="flex-1 min-h-0 relative bg-black/10">
            <textarea [(ngModel)]="testCasesJson" class="absolute inset-0 w-full h-full bg-transparent p-6 outline-none text-primary/80 font-mono text-xs leading-relaxed resize-none custom-scrollbar"></textarea>
        </div>
        <div class="p-2.5 flex justify-between items-center bg-black/20 border-t border-white/10 shrink-0">
            <span class="text-[9px] text-gray-500 uppercase tracking-tight ml-2">JSON Array Format Required</span>
            <div class="flex gap-2">
                <button (click)="formatJson()" class="text-gray-400 hover:text-white px-3 py-1.5 text-[10px] font-bold uppercase transition-colors cursor-pointer">Format JSON</button>
                <button (click)="verifySchema()" class="bg-primary/10 text-primary border border-primary/20 px-4 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest hover:bg-primary/20 transition-all cursor-pointer">Verify Schema</button>
            </div>
        </div>
      </section>

      <section class="bg-bg1/15 rounded-2xl border border-white/5 flex flex-col shadow-xl shrink-0">
        <div class="px-4 py-2 border-b border-white/10 bg-bg1/15">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Configuration</h2>
        </div>

        <div class="p-5 flex items-center justify-between gap-6">
          <div class="space-y-3">
            <label class="text-[9px] text-gray-500 uppercase tracking-widest block">Difficulty Rating</label>
            <div class="flex gap-2">
              @for (lvl of ['Easy', 'Medium', 'Hard']; track lvl) {
                <button (click)="selectedDifficulty.set(lvl)"
                  [class.bg-primary/20]="selectedDifficulty() === lvl"
                  [class.text-primary]="selectedDifficulty() === lvl"
                  [class.border-primary/30]="selectedDifficulty() === lvl"
                  class="bg-white/5 text-gray-400 border border-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase transition-all hover:bg-white/10 cursor-pointer">
                  {{ lvl }}
                </button>
              }
            </div>
          </div>

          <div class="flex flex-col items-center gap-2">
            <button (click)="saveProblem()" 
              class="bg-primary hover:brightness-110 px-10 py-3 rounded-2xl text-black text-xs font-black uppercase tracking-widest shadow-[0_10px_20px_rgba(250,204,21,0.2)] transition-all active:scale-95 cursor-pointer">
              Publish Problem
            </button>
            
            <button (click)="onCancel()" 
              class="text-gray-500 hover:text-white text-[9px] font-bold uppercase tracking-widest transition-colors cursor-pointer">
              Discard Draft
            </button>
          </div>
        </div>

        <div class="px-6 py-2.5 bg-black/20 rounded-b-2xl border-t border-white/5">
          <p class="text-[9px] text-gray-500/80 italic text-center leading-none">
            * Changes will be synced to the shared question bank for all instructors.
          </p>
        </div>
      </section>
    </div>
  </div>
</div>
