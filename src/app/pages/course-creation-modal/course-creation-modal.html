<div class="fixed inset-0 z-[2000] grid place-items-center bg-black/80 p-4 overflow-y-auto" (click)="onCancel()">
  <section role="dialog" aria-modal="true" aria-labelledby="create-course-heading" class="panel w-full max-w-lg" (click)="$event.stopPropagation()">
    <h2 id="create-course-heading">Create course</h2><p class="muted">After creating a course, share its join code with your students.</p>
    <form (ngSubmit)="onSubmit()" class="grid gap-5 mt-6">
      <label for="course-name">Course name<input id="course-name" name="courseName" [(ngModel)]="courseName" required minlength="3" maxlength="80" autofocus /></label>
      <label for="course-start">Start date<input id="course-start" name="startDate" type="date" [(ngModel)]="startDate" required /></label>
      <label for="course-end">End date<input id="course-end" name="endDate" type="date" [(ngModel)]="endDate" [min]="startDate" required /></label>
      @if (error()) { <p class="error" role="alert">{{error()}}</p> }
      <div class="actions"><button type="button" (click)="onCancel()" [disabled]="saving()">Cancel</button><button type="submit" class="primary" [disabled]="saving()">{{saving() ? 'Creating…' : 'Create course'}}</button></div>
    </form>
  </section>
</div>
