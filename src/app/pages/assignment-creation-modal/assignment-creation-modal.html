<div class="fixed inset-0 z-[2000] grid place-items-center bg-black/80 p-4 overflow-y-auto" (click)="onCancel()">
  <section role="dialog" aria-modal="true" aria-labelledby="create-assignment-heading" class="panel w-full max-w-lg" (click)="$event.stopPropagation()">
    <h2 id="create-assignment-heading">Create assignment draft</h2><p class="muted">Only you can see this draft. Add problems and choose when to publish it.</p>
    <form (ngSubmit)="onCreate()" class="grid gap-5 mt-6">
      <label for="assignment-title">Assignment title<input id="assignment-title" name="title" [(ngModel)]="assignmentTitle" required minlength="3" maxlength="200" autofocus /></label>
      <label for="assignment-description">Instructions (optional)<textarea id="assignment-description" name="description" [(ngModel)]="description" rows="4" maxlength="5000"></textarea></label>
      @if (error()) { <p class="error" role="alert">{{error()}}</p> }
      <div class="actions"><button type="button" (click)="onCancel()" [disabled]="saving()">Cancel</button><button class="primary" type="submit" [disabled]="saving()">{{saving() ? 'Creating…' : 'Create draft'}}</button></div>
    </form>
  </section>
</div>
