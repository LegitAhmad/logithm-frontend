<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-xl p-4" (click)="onCancel()">
  
  <div class="w-full max-w-2xl bg-white/[0.03] border border-white/10 rounded-[2.5rem] p-8 md:p-10 shadow-2xl relative flex flex-col animate-in fade-in zoom-in duration-500" (click)="$event.stopPropagation()">
    
    <div class="mb-8">
      <h2 class="text-primary text-3xl font-extrabold tracking-tight">Create New Assignment</h2>
      <p class="text-white/30 text-[11px] uppercase tracking-[0.4em] font-bold mt-1">Academic Management System</p>
    </div>

    <div class="space-y-6 flex-1">
      
      <div class="space-y-2 text-left">
        <label class="text-[10px] font-bold text-white/30 uppercase tracking-widest ml-1">Assignment Title</label>
        <input type="text" 
          [ngModel]="assignmentTitle()" 
          (ngModelChange)="assignmentTitle.set($event)"
          placeholder="e.g. Lab Report 01: OOP Fundamentals"
          class="w-full bg-bg1 border border-white/10 rounded-2xl px-6 py-4 text-sm text-white focus:outline-none focus:border-primary/50 hover:border-primary/50 transition-all shadow-inner" />
      </div>

      <div class="p-5 bg-primary/5 rounded-2xl border border-white/5">
          <p class="text-[11px] text-gray-400 italic leading-relaxed text-center">
              * This assignment will be immediately visible to all enrolled students.
          </p>
      </div>

    </div>

    <div class="mt-10 flex justify-end gap-5 pt-8 border-t border-white/5 shrink-0">
      <button (click)="onCancel()" class="px-8 py-3 text-xs font-bold text-white/30 hover:text-white transition-all uppercase tracking-widest cursor-pointer">
        Cancel
      </button>

      <button (click)="onCreate()" 
        [disabled]="!assignmentTitle().trim()"
        class="px-10 py-3.5 rounded-full bg-primary text-bg1 text-xs font-black uppercase tracking-widest transition-all shadow-lg shadow-primary/20 
               disabled:opacity-50 disabled:cursor-not-allowed
               hover:scale-[1.02] active:scale-[0.98] cursor-pointer">
        Create Assignment
      </button>
    </div>
  </div>
</div>
