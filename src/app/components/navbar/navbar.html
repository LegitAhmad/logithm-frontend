@if (isProfileMenuOpen()) {
  <div class="pointer-events-none fixed inset-0 z-900 bg-black/35"></div>
}

<nav
  class="flex items-center justify-between px-6 md:px-12 py-5 bg-white/4 left-10 my-8 right-10 rounded-xl backdrop-blur-md fixed z-1000"
>

  <div class="flex items-center gap-3 cursor-pointer">
    <div
      class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/10 group-hover:rotate-12 transition-transform">
      <div class="w-5 h-5 bg-bg1 rounded-sm rotate-45"></div>
    </div>
    <a
      routerLink="/"
      (click)="scrollToTop()"
      class="text-white text-xl sm:text-2xl font-bold tracking-normal"
      >Logithm</a
    >
  </div>

  <div class="flex font-semibold items-center gap-4">
    @if (!isLoggedIn()) {
      <div class="flex items-center gap-2">
        <a
          routerLink="/login"
          class="text-center text-primary/70 w-25 h-10 hover:scale-105 hover:text-primary/90 border-primary/70 border rounded-lg transition duration-300 hover:border-primary/90 px-4 py-2 cursor-pointer"
        >
          Login
        </a>
        <a
          routerLink="/signup"
          class="text-center bg-primary/90 w-25 h-10 border border-primary/20 text-black/90 px-5 py-2 rounded-lg hover:bg-primary hover:scale-105 hover:text-bg1 duration-300 transition-all cursor-pointer"
        >
          Sign Up
        </a>
      </div>
    } @else {
      <div class="flex items-center gap-4">
        <button
          (click)="onLogout()"
          class="text-white/60 hover:text-white text-sm transition-colors cursor-pointer"
        >
          Logout
        </button>

        <div
          class="relative z-10"
          (mouseenter)="openProfileMenu()"
          (mouseleave)="scheduleCloseProfileMenu()"
        >
          <img
            [src]="user()?.avatarUrl || '/defaultPfp.webp'"
            alt="Profile"
            class="w-10 h-10 rounded-full border-2 border-primary/50 hover:border-primary cursor-pointer object-cover transition-all"
          />
        </div>
      </div>
    }
  </div>
</nav>

@if (isProfileMenuOpen()) {
  <div
    class="fixed inset-0 z-900 bg-black/35"
    aria-hidden="true"
    (click)="closeProfileMenu()"
  ></div>

  <div
    role="menu"
    class="fixed right-10 top-28 z-1001 w-56 rounded-xl border border-white/10 bg-bg2 p-2 shadow-2xl"
    (mouseenter)="openProfileMenu()"
    (mouseleave)="scheduleCloseProfileMenu()"
  >
    <a
      routerLink="/settings"
      role="menuitem"
      class="block rounded-lg px-3 py-2 text-sm text-white/90 hover:bg-bg3"
      (click)="closeProfileMenu()"
    >
      Settings
    </a>
    <button
      type="button"
      role="menuitem"
      class="block w-full cursor-pointer rounded-lg px-3 py-2 text-left text-sm text-red-300 hover:bg-bg3"
      (click)="onLogout()"
    >
      Log Out
    </button>
  </div>
}
