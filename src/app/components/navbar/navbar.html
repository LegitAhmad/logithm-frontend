<nav aria-label="Main navigation" class="app-nav">
  <a routerLink="/" class="brand" (click)="closeProfileMenu()"><span class="brand-mark" aria-hidden="true"></span>Logithm</a>
  @if (isLoggedIn()) {
    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">Courses</a>
      <a routerLink="/problems" routerLinkActive="active">Problems</a>
      <a routerLink="/submissions" routerLinkActive="active">Submissions</a>
    </div>
    <button type="button" class="profile-button" aria-label="Account navigation" [attr.aria-expanded]="isProfileMenuOpen()" aria-controls="account-navigation" (click)="isProfileMenuOpen() ? closeProfileMenu() : openProfileMenu()">
      <img [src]="user()?.avatarUrl || '/defaultPfp.webp'" alt="" width="36" height="36" />
    </button>
    @if (isProfileMenuOpen()) {
      <div id="account-navigation" class="account-navigation">
        <a routerLink="/settings" (click)="closeProfileMenu()">Settings</a>
        <button type="button" (click)="onLogout()">Log out</button>
      </div>
    }
  } @else {
    <div class="nav-links"><a routerLink="/login">Log in</a><a routerLink="/signup" class="join-link">Sign up</a></div>
  }
</nav>
