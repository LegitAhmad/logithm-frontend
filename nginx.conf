worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $uri $cache_control {
        default "";
        /index.html no-store;
    }

    upstream api {
        zone api 64k;
        server backend:3000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 6m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control $cache_control always;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /api { return 308 /api/; }
        location /api/ {
            # Strip /api/ while preserving all backend paths and query strings.
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            # Grading is synchronous: 120s budget, up to 40s for an admitted
            # executor call to settle, then response/persistence slack.
            proxy_read_timeout 210s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
